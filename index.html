<style>
  /* Prevent font flash: hide body briefly until Syne is loaded */
  body { opacity: 0; }
  body.fonts-loaded { opacity: 1; transition: opacity 0.1s; }
</style>
<script>
  // Mark fonts as loaded once Google Fonts are ready (or after 500ms max)
  if (document.fonts) {
    document.fonts.ready.then(function() {
      document.body && document.body.classList.add('fonts-loaded');
    });
    setTimeout(function() {
      document.body && document.body.classList.add('fonts-loaded');
    }, 500);
  } else {
    document.addEventListener('DOMContentLoaded', function() {
      document.body.classList.add('fonts-loaded');
    });
  }
</script>
<style>
:root {
/* ── FIX POLICES GLOBAL ── */
html {
  font-size: 16px;

  text-size-adjust: 100%;
}

body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  line-height: 1.3;
}

/* Empêche les débordements */
* {
  max-width: 100%;
}

/* Uniformise tous les inputs */
input, button, select, textarea {
  font-family: inherit;
  font-size: 1rem;
}

/* ── TYPO RESPONSIVE ── */

/* Splash */

}

/* Profil */

}

  font-size: clamp(18px, 4.5vw, 22px);
}

}

}

  font-size: clamp(13px, 3.5vw, 15px);
}

/* Boutons */
.finish-btn {
  font-size: clamp(14px, 4vw, 16px);
}

  --mischa:#D63EBC; --mischa-dim:rgba(214,62,188,0.12);
  --accent:#DC143C;
  --bg:#f4f3f0; --bg2:#eceae6; --bg3:#e0deda;
  --card:#ffffff; --border:#dddbd6; --text:#111111;

  --green:#16a34a; --red:#DC143C;
}

}

.splash-title { font-size: clamp(20px, 5vw, 26px); }

.profile-card-name { font-size: clamp(20px, 5vw, 26px); }

.section-header h2 { font-size: clamp(18px, 4.5vw, 22px); }

.input-field { font-size: clamp(13px, 3.5vw, 15px); }

[data-theme="dark"] {
  --bg:#0e0e0e; --bg2:#1a1a1a; --bg3:#252525;
  --card:#181818; --border:#2a2a2a; --text:#efefef;
  --text2:#888888; --text3:#444444; --shadow:rgba(0,0,0,0.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Syne',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s;}

/* ── SPLASH ── */
.splash{position:fixed;inset:0;z-index:500;display:flex;flex-direction:column;overflow:hidden;}
.splash.hidden{display:none;}
.splash-top{flex:1.5;background:linear-gradient(135deg,#DC143C 0%,#D63EBC 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:50px 28px 44px;position:relative;}
.splash-top::after{content:'';position:absolute;bottom:-28px;left:0;right:0;height:56px;background:#ffffff;border-radius:28px 28px 0 0;z-index:1;}
.splash-logo{width:86px;filter:brightness(0) invert(1);}
.splash-title{font-size:26px;font-weight:800;color:white;letter-spacing:-1px;text-align:center;}
.splash-bottom{flex:1;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:20px 28px 36px;position:relative;z-index:2;}
.splash-btn{width:100%;max-width:320px;padding:16px 24px;border-radius:50px;border:none;cursor:pointer;font-family:'Syne',-apple-system,sans-serif;font-weight:800;font-size:16px;background:linear-gradient(135deg,#DC143C,#D63EBC);color:white;display:flex;align-items:center;justify-content:center;gap:10px;transition:opacity .2s;box-shadow:0 4px 24px rgba(220,20,60,0.3);}
.splash-btn:active{opacity:.85;}
.splash-by{font-size:11px;color:#cccccc;font-family:'DM Mono','Courier New',monospace;letter-spacing:1px;margin-top:18px;}

/* ── PROFILE SCREEN ── */
.profile-screen{position:fixed;inset:0;z-index:400;display:flex;flex-direction:column;overflow:hidden;}
.profile-screen.hidden{display:none;}
.profile-top{flex:1.2;background:#ffffff;display:flex;flex-direction:column;align-items:center;padding:36px 20px 0;position:relative;z-index:2;}
[data-theme="dark"] .profile-top{background:#181818;}
.profile-top::after{content:'';position:absolute;bottom:-28px;left:0;right:0;height:56px;background:#ffffff;border-radius:0 0 28px 28px;z-index:1;}
[data-theme="dark"] .profile-top::after{background:#181818;}
.profile-who{font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--text);margin-bottom:20px;text-align:center;}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;}
.profile-card{border-radius:18px;cursor:pointer;border:2px solid transparent;position:relative;overflow:hidden;transition:transform .15s;aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:0 4px 16px var(--shadow);}
.profile-card:active{transform:scale(0.97);}
.profile-card.thomas{background:linear-gradient(160deg,rgba(220,20,60,0.2) 0%,rgba(220,20,60,0.04) 100%);border-color:var(--thomas);}
.profile-card.mischa{background:linear-gradient(160deg,rgba(214,62,188,0.2) 0%,rgba(214,62,188,0.04) 100%);border-color:var(--mischa);}
[data-theme="dark"] .profile-card.thomas{background:linear-gradient(160deg,rgba(220,20,60,0.3) 0%,rgba(220,20,60,0.08) 100%);}
[data-theme="dark"] .profile-card.mischa{background:linear-gradient(160deg,rgba(214,62,188,0.3) 0%,rgba(214,62,188,0.08) 100%);}
.profile-card-initial{position:absolute;top:12px;left:14px;font-size:54px;font-weight:800;line-height:1;opacity:0.07;font-family:'Syne',sans-serif;}
.profile-card.thomas .profile-card-initial{color:var(--thomas);}
.profile-card.mischa .profile-card-initial{color:var(--mischa);}
.profile-card-body{padding:18px 16px 16px;}
.profile-card-name{font-size:26px;font-weight:800;line-height:1;letter-spacing:-1px;}
.profile-card.thomas .profile-card-name{color:var(--thomas);}
.profile-card.mischa .profile-card-name{color:var(--mischa);}
.profile-card-bar{height:3px;border-radius:2px;margin-top:12px;opacity:0.4;}
.profile-card.thomas .profile-card-bar{background:var(--thomas);}
.profile-card.mischa .profile-card-bar{background:var(--mischa);}
.profile-bottom{flex:1;background:linear-gradient(135deg,#DC143C 0%,#D63EBC 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:44px 28px 32px;position:relative;z-index:0;}
.profile-bottom::before{content:'';position:absolute;top:-28px;left:0;right:0;height:56px;background:linear-gradient(135deg,#DC143C 0%,#D63EBC 100%);border-radius:28px 28px 0 0;}
.profile-logo-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;position:relative;z-index:1;}
.profile-logo{width:66px;filter:brightness(0) invert(1);}
.profile-logo-text{font-size:12px;font-weight:700;color:rgba(255,255,255,0.45);letter-spacing:2px;font-family:'DM Mono','Courier New',monospace;}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;}
.topbar-title{font-size:17px;font-weight:800;letter-spacing:-.5px;line-height:1.1;}
.topbar-sub{font-size:10px;color:var(--text3);font-family:'DM Mono','Courier New',monospace;letter-spacing:1px;margin-top:1px;}
.icon-btn{background:none;border:none;cursor:pointer;color:var(--text2);padding:6px;border-radius:8px;display:flex;align-items:center;transition:color .2s;}
.screen{display:none;padding:20px;max-width:480px;margin:0 auto;}
.screen.active{display:block;}
.main-content{padding-bottom:80px;}

/* ── NAV ── */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:150;background:var(--card);border-top:1px solid var(--border);display:none;}
.bottom-nav-inner{display:flex;max-width:480px;margin:0 auto;}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:10px 0 14px;cursor:pointer;background:none;border:none;color:var(--text3);font-family:'Syne',sans-serif;font-size:10px;font-weight:700;letter-spacing:.5px;gap:3px;transition:color .2s;}
.nav-item.active{color:var(--accent);}
.nav-item svg{width:20px;height:20px;}
.back-btn{display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;color:var(--text2);font-family:'Syne',sans-serif;font-size:13px;font-weight:700;padding:0;margin-bottom:18px;}
.section-header{margin-bottom:18px;}
.section-header h2{font-size:22px;font-weight:800;letter-spacing:-.5px;}
.section-header p{color:var(--text2);font-size:13px;margin-top:4px;}
.profile-badge{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:14px;}
.profile-badge.thomas{background:var(--thomas-dim);color:var(--thomas);}
.profile-badge.mischa{background:var(--mischa-dim);color:var(--mischa);}
.badge-dot{width:6px;height:6px;border-radius:50%;}
.profile-badge.thomas .badge-dot{background:var(--thomas);}
.profile-badge.mischa .badge-dot{background:var(--mischa);}

/* ── SESSIONS ── */
.session-cards{display:flex;flex-direction:column;gap:10px;}
.session-card{background:var(--card);border-radius:14px;padding:16px 18px;cursor:pointer;border:1px solid var(--border);transition:transform .15s;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px var(--shadow);}
.session-card:active{transform:scale(0.98);}
.session-num{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text3);font-family:'DM Mono','Courier New',monospace;margin-bottom:3px;}
.session-name{font-size:14px;font-weight:700;}
.session-count{font-size:11px;color:var(--text2);margin-top:2px;}
.session-arrow{color:var(--text3);font-size:18px;}
.launch-msg{background:var(--card);border-radius:14px;padding:14px 18px;margin-bottom:14px;border:1px solid var(--border);font-size:14px;font-weight:700;font-style:italic;color:var(--text2);text-align:center;}

/* ── WORKOUT ── */
.workout-header{margin-bottom:14px;}
.workout-session-label{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text3);font-family:'DM Mono','Courier New',monospace;margin-bottom:3px;}
.workout-title{font-size:19px;font-weight:800;letter-spacing:-.5px;}
.exo-card{background:var(--card);border-radius:14px;margin-bottom:10px;border:1px solid var(--border);overflow:hidden;box-shadow:0 2px 8px var(--shadow);}
.exo-card.together{border-left:3px solid var(--text3);}
.exo-card.solo-thomas{border-left:3px solid var(--thomas);}
.exo-card.solo-mischa{border-left:3px solid var(--mischa);}
.exo-top{padding:12px 14px 8px;display:flex;justify-content:space-between;align-items:center;}
.exo-num{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text3);font-family:'DM Mono','Courier New',monospace;}
.exo-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;}
.exo-tag.together{background:var(--bg2);color:var(--text3);}
.exo-tag.solo-thomas{background:var(--thomas-dim);color:var(--thomas);}
.exo-tag.solo-mischa{background:var(--mischa-dim);color:var(--mischa);}
.exo-name{font-size:15px;font-weight:700;padding:0 14px 3px;}
.exo-target{font-size:11px;color:var(--text2);padding:0 14px 4px;font-family:'DM Mono','Courier New',monospace;}
.exo-partner{font-size:11px;color:var(--text3);padding:0 14px 8px;font-style:italic;}
.exo-body{border-top:1px solid var(--border);padding:10px 14px 12px;}
.suggest-bar{background:var(--bg2);border-radius:8px;padding:8px 12px;margin-bottom:10px;}
.perf-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.perf-label{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text3);font-family:'DM Mono','Courier New',monospace;}
.perf-val{font-size:13px;font-weight:700;font-family:'DM Mono','Courier New',monospace;}
.perf-obj{font-size:11px;font-weight:700;font-family:'DM Mono','Courier New',monospace;color:var(--text2);margin-left:auto;}
.input-row{display:flex;gap:10px;align-items:flex-end;margin-bottom:10px;}
.input-group{flex:1;}
.input-label{font-size:10px;font-weight:700;letter-spacing:1px;color:var(--text3);margin-bottom:4px;}
.input-field{width:100%;padding:9px 10px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text);font-family:'DM Mono','Courier New',monospace;font-size:15px;font-weight:500;text-align:center;outline:none;transition:border-color .2s;}
.input-field[type="text"]{text-align:left;font-size:13px;}
.input-field:focus{border-color:var(--accent);}
.input-unit{font-size:11px;color:var(--text3);text-align:center;margin-top:3px;font-family:'DM Mono','Courier New',monospace;}
.timer-exo-btn{width:100%;padding:9px;border-radius:10px;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:12px;background:var(--bg3);color:var(--text2);transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.timer-exo-btn.running{background:var(--accent);color:white;}
.timer-exo-btn.done-state{background:rgba(22,163,74,0.15);color:var(--green);}
.finish-btn{width:100%;padding:16px;border-radius:14px;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;background:var(--accent);color:white;margin-top:6px;margin-bottom:20px;transition:opacity .2s;}
.finish-btn:active{opacity:.8;}
.filter-row{display:flex;gap:8px;margin-bottom:16px;}
.filter-btn{padding:6px 14px;border-radius:20px;border:1.5px solid var(--border);background:none;cursor:pointer;font-family:'Syne',sans-serif;font-size:12px;font-weight:700;color:var(--text2);transition:all .2s;}
.filter-btn.active{background:var(--accent);border-color:var(--accent);color:white;}
.history-empty{text-align:center;padding:50px 20px;color:var(--text3);font-size:13px;}
.history-block{margin-bottom:20px;}
.history-date{font-size:10px;font-weight:700;letter-spacing:2px;color:var(--text3);font-family:'DM Mono','Courier New',monospace;margin-bottom:8px;}
.history-card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:12px 14px;margin-bottom:6px;}
.history-card-title{font-size:13px;font-weight:700;margin-bottom:8px;}
.history-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid var(--border);font-size:12px;}
.history-row:last-child{border-bottom:none;}
.history-row-name{color:var(--text2);}
.history-row-val{font-family:'DM Mono','Courier New',monospace;font-weight:500;color:var(--text);}
.chart-select{width:100%;padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg2);color:var(--text);font-family:'Syne',sans-serif;font-size:14px;font-weight:600;outline:none;appearance:none;cursor:pointer;margin-bottom:14px;}
.chart-wrap{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:16px;box-shadow:0 2px 8px var(--shadow);min-height:200px;display:flex;align-items:center;justify-content:center;}
.chart-empty{color:var(--text3);font-size:13px;text-align:center;}
canvas{width:100%!important;}
.modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.5);display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.visible{display:flex;}
.modal{background:var(--card);border-radius:20px 20px 0 0;padding:24px 20px 44px;width:100%;max-width:480px;animation:slideUp .25s ease;}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-title{font-size:20px;font-weight:800;margin-bottom:10px;}
.modal-text{font-size:14px;color:var(--text2);line-height:1.6;margin-bottom:20px;}
.modal-btn{width:100%;padding:14px;border-radius:12px;border:none;cursor:pointer;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;background:var(--accent);color:white;}
/* ── STYLE SPORT ── */
h1, h2,
.workout-title,
.profile-card-name,
.splash-title {
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 1px;
}
/* Ajustement visuel Bebas */
.profile-card-name {
  font-size: clamp(22px, 6vw, 28px);
}

.workout-title {
  font-size: clamp(18px, 5vw, 22px);
}
/* ── HIÉRARCHIE PRO ── */
.section-header h2 {
  letter-spacing: 0.5px;
}

.session-name,
.exo-name {
  font-weight: 700;
  letter-spacing: 0.2px;
}

.session-count,
.exo-target,
.exo-partner {
  opacity: 0.75;
}

/* ── CARTES PRO ── */
.session-card,
.exo-card,
.history-card {
  border-radius: 16px;
  box-shadow: 0 6px 20px rgba(0,0,0,0.06);
}

[data-theme="dark"] .session-card,
[data-theme="dark"] .exo-card {
  box-shadow: 0 6px 20px rgba(0,0,0,0.4);
}

/* ── ANIMATIONS ── */
.session-card,
.exo-card,
.profile-card {
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.session-card:active,
.exo-card:active,
.profile-card:active {
  transform: scale(0.97);
}

.session-card:hover,
.exo-card:hover {
  transform: translateY(-2px);
}

/* ── BOUTONS PRO ── */
.finish-btn {
  box-shadow: 0 8px 24px rgba(220,20,60,0.3);
  letter-spacing: 0.5px;
}

.finish-btn:active {
  transform: scale(0.97);
}

/* ── MICRO DÉTAILS ── */
.topbar-title {
  display: flex;
  flex-direction: column;
}

.section-header {
  margin-bottom: 22px;
}

.input-field {
  border-radius: 12px;
}

html {
  scroll-behavior: smooth;
}

/* ── COULEUR SOFT ── */
:root {
  --accent-soft: rgba(220,20,60,0.08);
}

.session-card:active,
.exo-card:active {
  background: var(--accent-soft);
}

/* ── NETTETÉ TEXTE ── */
body {
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
/* ── ANIMATION APPARITION ── */
@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.session-card,
.exo-card,
.history-card {
  animation: fadeUp 0.4s ease;
}
/* ── TRANSITION ENTRE ÉCRANS ── */
.screen {
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.25s ease;
}

.screen.active {
  opacity: 1;
  transform: translateY(0);
}
/* ── BOUTONS INTERACTIFS ── */
.finish-btn,
.splash-btn {
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

.finish-btn:hover,
.splash-btn:hover {
  transform: translateY(-1px);
}

.finish-btn:active,
.splash-btn:active {
  transform: scale(0.96);
}
/* ── TAP FEEDBACK ── */
.session-card:active,
.exo-card:active {
  transform: scale(0.97);
  opacity: 0.9;
}
/* ── GLOW SUBTIL ── */
.finish-btn {
  position: relative;
  overflow: hidden;
}

.finish-btn::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(120deg, transparent, rgba(255,255,255,0.3), transparent);
  opacity: 0;
  transition: opacity 0.3s;
}

.finish-btn:hover::after {
  opacity: 1;
}
/* ── TIMER PULSE ── */
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

.timer-exo-btn.running {
  animation: pulse 1s infinite;
}
/* ── APPLE-LIKE SCREEN TRANSITION ── */

.screen {
  opacity: 0;
  transform: translateX(20px);
  filter: blur(6px);
  transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
}

.screen.active {
  opacity: 1;
  transform: translateX(0);
  filter: blur(0);
  pointer-events: auto;
}
/* ── iOS STYLE PUSH TRANSITION ── */

.screen {
  opacity: 0;
  transform: translate3d(30px, 0, 0);
  filter: blur(8px);
  transition: all 0.38s cubic-bezier(0.2, 0.8, 0.2, 1);
  will-change: transform, opacity, filter;
}

.screen.active {
  opacity: 1;
  transform: translate3d(0, 0, 0);
  filter: blur(0);
}
/* ── BACK NAV SMOOTH FEEL ── */
.screen.exit {
  opacity: 0;
  transform: translateX(-20px);
  filter: blur(6px);
}
</style>
</head>

let profile=null,session=null,histFilter='all',timerInterval=null,timerSecs=90,timerRunning=false,activeTimerExoId=null,chartInstance=null;
let darkMode=load('gym_theme',false);

function startApp(){
  document.getElementById('screen-splash').classList.add('hidden');
  document.getElementById('screen-profile').classList.remove('hidden');
}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function getHist(){return load('gym_hist_v2',[]);}
function saveHist(h){save('gym_hist_v2',h);}

function applyTheme(){document.documentElement.setAttribute('data-theme',darkMode?'dark':'light');}
function toggleTheme(){darkMode=!darkMode;save('gym_theme',darkMode);applyTheme();if(chartInstance)renderChart();}
applyTheme();

function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');}
function showNav(id){
  showScreen(id);
  ['nav-home','nav-history','nav-charts'].forEach(n=>document.getElementById(n).classList.remove('active'));
  const map={'screen-sessions':'nav-home','screen-history':'nav-history','screen-charts':'nav-charts'};
  if(map[id])document.getElementById(map[id]).classList.add('active');
  if(id==='screen-history')renderHistory();
  if(id==='screen-charts')renderChartsScreen();
}
function goBack(){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('bottom-nav').style.display='none';
  document.getElementById('screen-profile').classList.remove('hidden');
  stopTimer();
}

function badgeHTML(p){return `<div class="profile-badge ${p}"><div class="badge-dot"></div>${p==='thomas'?'Thomas':'Mischa'}</div>`;}
function setAccent(p){document.documentElement.style.setProperty('--accent',p==='thomas'?'#DC143C':'#D63EBC');}

function selectProfile(p){
  profile=p;setAccent(p);
  document.getElementById('screen-profile').classList.add('hidden');
  ['badge-sessions','badge-history','badge-charts'].forEach(id=>document.getElementById(id).innerHTML=badgeHTML(p));
  renderSessions();showScreen('screen-sessions');document.getElementById('bottom-nav').style.display='block';
}

function renderSessions(){
  document.getElementById('session-list').innerHTML=PROG[profile].map(s=>`
    <div class="session-card" onclick="selectSession('${s.id}')">
      <div><div class="session-num">SÉANCE ${s.num}</div><div class="session-name">${s.name}</div><div class="session-count">${s.exercises.length} exercices</div></div>
      <div class="session-arrow">→</div>
    </div>`).join('');
}

function selectSession(sid){
  session=PROG[profile].find(s=>s.id===sid);stopTimer();renderWorkout();showScreen('screen-workout');
}

function getPrevData(exoId){
  const h=getHist().filter(x=>x.profile===profile);
  for(let i=h.length-1;i>=0;i--){const e=h[i].exercises.find(x=>x.id===exoId);if(e&&e.weight)return e;}
  return null;
}

function getSug(exoId,prev){
  if(!prev||!prev.weight)return null;
  const inc=EXO_INC[exoId]??1.25;
  if(inc===0)return null;
  const exo=session.exercises.find(e=>e.id===exoId);
  if(!exo)return{weight:prev.weight,note:'Même poids'};
  const topRep=parseInt(exo.reps.toString().split('–')[1]||exo.reps)||999;
  const prevReps=parseInt(prev.reps)||0;
  if(prevReps>=topRep){
    const nw=(parseFloat(prev.weight)+inc).toFixed(2).replace(/\.?0+$/,'');
    return{weight:nw,note:`↑ +${inc}kg — ${topRep} reps atteintes !`};
  }
  return{weight:prev.weight,note:`Même poids — vise ${topRep} reps`};
}

function renderWorkout(){
  document.getElementById('badge-workout').innerHTML=badgeHTML(profile);
  document.getElementById('workout-label').textContent=`SÉANCE ${session.num}`;
  document.getElementById('workout-title').textContent=session.name;
  document.getElementById('launch-msg-wrap').innerHTML=`<div class="launch-msg">${rnd(LAUNCH[profile])}</div>`;
  document.getElementById('exo-list').innerHTML=session.exercises.map((exo,i)=>{
    const prev=getPrevData(exo.id),sug=getSug(exo.id,prev),noW=exo.noWeight;
    const tc=exo.together?'together':(profile==='thomas'?'solo-thomas':'solo-mischa');
    const tt=exo.together?'Ensemble':(profile==='thomas'?'Thomas seul':'Mischa seule');
    const prevRepsNum = prev ? parseInt(prev.reps) : 0;
    const exoTarget = session.exercises.find(e=>e.id===exo.id);
    const repsStr = exoTarget?.reps?.toString()||'';
    const topRep = parseInt(repsStr.split('–')[1]||repsStr)||999;
    const isMax = prev && prevRepsNum >= topRep;
    const perfColor = isMax ? '#16a34a' : '#DC143C';
    const perfText = prev && prev.weight && prev.reps ? `${prev.reps}×${prev.weight}kg` : null;
    const objText = sug ? (sug.note.includes('+') ? `↑ ${sug.weight}kg` : `→ vise ${topRep} reps`) : null;
    const sugBar = prev && perfText ? `
      <div class="suggest-bar">
        <div class="perf-row">
          <span class="perf-label">Dernière fois</span>
          <span class="perf-val" style="color:${perfColor};">${perfText}</span>
          ${objText ? `<span class="perf-obj">${objText}</span>` : ''}
        </div>
      </div>` : '';
    const isAbdo = exo.isAbdo;
    const inputs=noW?`
      <div class="input-row"><div class="input-group"><div class="input-label">REPS EFFECTUÉES</div><input class="input-field" type="number" inputmode="numeric" id="reps-${exo.id}" placeholder="—"><div class="input-unit">reps</div></div></div>`:(isAbdo?`
      <div class="input-row"><div class="input-group" style="flex:2"><div class="input-label">EXERCICE</div><input class="input-field" type="text" id="abdo-name-${exo.id}" placeholder="${prev&&prev.abdoName?prev.abdoName:'Ex: Crunch câble'}"><div class="input-unit">exercice</div></div></div>
      <div class="input-row">
        <div class="input-group"><div class="input-label">POIDS</div><input class="input-field" type="number" inputmode="decimal" id="weight-${exo.id}" placeholder="${sug?sug.weight:(prev?prev.weight:'0')}"><div class="input-unit">kg</div></div>
        <div class="input-group"><div class="input-label">REPS</div><input class="input-field" type="number" inputmode="numeric" id="reps-${exo.id}" placeholder="${prev?prev.reps:'—'}"><div class="input-unit">reps</div></div>
      </div>`:`
      <div class="input-row">
        <div class="input-group"><div class="input-label">POIDS</div><input class="input-field" type="number" inputmode="decimal" id="weight-${exo.id}" placeholder="${sug?sug.weight:(prev?prev.weight:'0')}"><div class="input-unit">kg</div></div>
        <div class="input-group"><div class="input-label">REPS</div><input class="input-field" type="number" inputmode="numeric" id="reps-${exo.id}" placeholder="${prev?prev.reps:'—'}"><div class="input-unit">reps</div></div>
      </div>`);
    return `<div class="exo-card ${tc}">
      <div class="exo-top"><div class="exo-num">EXO ${String(i+1).padStart(2,'0')}</div><div class="exo-tag ${tc}">${tt}</div></div>
      <div class="exo-name">${exo.name}</div>
      <div class="exo-target">${exo.sets} séries × ${exo.reps}</div>
      ${exo.partnerExo?`<div class="exo-partner">↔ ${exo.partnerExo}</div>`:''}
      <div class="exo-body">${sugBar}${inputs}
        <button class="timer-exo-btn" id="tbtn-${exo.id}" onclick="toggleTimer('${exo.id}')">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          Démarrer le repos · 1:30
        </button>
      </div>
    </div>`;
  }).join('');
}

function fmt(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;}
function toggleTimer(exoId){
  if(timerRunning&&activeTimerExoId===exoId){stopTimer();return;}
  stopTimer();activeTimerExoId=exoId;timerSecs=90;timerRunning=true;updateBtn();
  timerInterval=setInterval(()=>{
    timerSecs--;updateBtn();
    if(timerSecs<=0){
      clearInterval(timerInterval);timerRunning=false;
      const b=document.getElementById(`tbtn-${activeTimerExoId}`);
      if(b){b.className='timer-exo-btn done-state';b.innerHTML=`✓ ${rnd(TIMER_DONE[profile])}`;}
    }
  },1000);
}
function updateBtn(){
  const b=document.getElementById(`tbtn-${activeTimerExoId}`);
  if(!b)return;
  b.className='timer-exo-btn running';
  b.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> ${fmt(timerSecs)} · Appuie pour stopper`;
}
function stopTimer(){
  clearInterval(timerInterval);timerRunning=false;
  if(activeTimerExoId){
    const b=document.getElementById(`tbtn-${activeTimerExoId}`);
    if(b){b.className='timer-exo-btn';b.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Démarrer le repos · 1:30`;}
  }
  activeTimerExoId=null;
}

function finishWorkout(){
  const record={profile,sessionId:session.id,sessionName:session.name,date:new Date().toISOString(),
    exercises:session.exercises.map(exo=>{
      const abdoNameEl=document.getElementById(`abdo-name-${exo.id}`);
      return {id:exo.id,name:exo.name,weight:document.getElementById(`weight-${exo.id}`)?.value||'',reps:document.getElementById(`reps-${exo.id}`)?.value||'',abdoName:abdoNameEl?abdoNameEl.value:''};
    })};
  const h=getHist();h.push(record);saveHist(h);stopTimer();
  const filled=record.exercises.filter(e=>e.weight||e.reps).length;
  document.getElementById('modal-title').textContent=rnd(FINISH[profile]);
  document.getElementById('modal-text').innerHTML=`<strong>${session.name}</strong><br><br>${filled} exercice${filled>1?'s':''} enregistré${filled>1?'s':''}.`;
  document.getElementById('modal').classList.add('visible');
}
function closeModal(){document.getElementById('modal').classList.remove('visible');showNav('screen-sessions');}

function setFilter(f){
  histFilter=f;
  document.getElementById('filter-all').className='filter-btn'+(f==='all'?' active':'');
  document.getElementById('filter-weighted').className='filter-btn'+(f==='weighted'?' active':'');
  renderHistory();
}

function renderHistory(){
  const hist=getHist().filter(h=>h.profile===profile).reverse();
  const el=document.getElementById('history-content');
  if(!hist.length){el.innerHTML='<div class="history-empty">Aucune séance encore 💪</div>';return;}
  el.innerHTML=hist.map(h=>{
    const d=new Date(h.date);
    const ds=d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();
    const exos=h.exercises.filter(e=>histFilter==='all'||(histFilter==='weighted'&&e.weight));
    if(!exos.length)return'';
    return`<div class="history-block"><div class="history-date">${ds}</div><div class="history-card"><div class="history-card-title">${h.sessionName}</div>${exos.map(e=>`<div class="history-row"><span class="history-row-name">${e.name}</span><span class="history-row-val">${e.weight?e.weight+' kg':'—'}${e.reps?' × '+e.reps+' reps':''}</span></div>`).join('')}</div></div>`;
  }).filter(Boolean).join('');
  if(!el.innerHTML.trim())el.innerHTML='<div class="history-empty">Aucune donnée avec ce filtre</div>';
}

function renderChartsScreen(){
  const allExos=[];
  PROG[profile].forEach(s=>s.exercises.forEach(e=>{if(!e.noWeight&&!allExos.find(x=>x.id===e.id))allExos.push({id:e.id,name:e.name});}));
  const sel=document.getElementById('chart-select');
  const cur=sel.value;
  sel.innerHTML='<option value="">Choisir un exercice…</option>'+allExos.map(e=>`<option value="${e.id}"${e.id===cur?' selected':''}>${e.name}</option>`).join('');
  if(cur)renderChart();
}

function renderChart(){
  const exoId=document.getElementById('chart-select').value;
  const wrap=document.getElementById('chart-wrap');
  if(!exoId){wrap.innerHTML='<div class="chart-empty">Sélectionne un exercice pour voir ta progression</div>';return;}
  const hist=getHist().filter(h=>h.profile===profile);
  const exo=PROG[profile].flatMap(s=>s.exercises).find(e=>e.id===exoId);
  const points=[];
  hist.forEach(h=>{
    const e=h.exercises.find(x=>x.id===exoId);
    if(e&&e.weight&&e.reps){
      const reps=parseInt(e.reps);
      const repsStr=exo?.reps?.toString()||'';
      const parts=repsStr.split('–');
      const low=parseInt(parts[0])||0;
      const high=parseInt(parts[1]||parts[0])||999;
      const inRange=reps>=low&&reps<=high;
      if(inRange&&!isNaN(parseFloat(e.weight)))
        points.push({x:new Date(h.date).toLocaleDateString('fr-FR',{day:'numeric',month:'short'}),y:parseFloat(e.weight)});
    }
  });
  if(!points.length){wrap.innerHTML=`<div class="chart-empty">Pas encore de données pour "${exo?.name}"</div>`;return;}
  wrap.innerHTML='<canvas id="myChart"></canvas>';
  if(chartInstance)chartInstance.destroy();
  const color=profile==='thomas'?'#DC143C':'#D63EBC';
  chartInstance=new Chart(document.getElementById('myChart'),{
    type:'line',
    data:{labels:points.map(p=>p.x),datasets:[{label:'Volume',data:points.map(p=>p.y),borderColor:color,backgroundColor:color+'22',borderWidth:2.5,pointBackgroundColor:color,pointRadius:5,tension:0.3,fill:true}]},
    options:{responsive:true,plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>`${ctx.parsed.y} kg`}}},
      scales:{x:{ticks:{color:darkMode?'#555':'#aaa',font:{family:'DM Mono',size:10}},grid:{color:darkMode?'#222':'#eee'}},y:{ticks:{color:darkMode?'#555':'#aaa',font:{family:'DM Mono',size:10},callback:v=>v+' kg'},grid:{color:darkMode?'#222':'#eee'}}}}
  });
}
